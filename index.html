<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

  .body1 {
      display: grid;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .unaLayer {
      height: 748px;
      width: 748px;
      display: grid;
      background-color: #000;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap: 9px;
    }
    .item {
      background-color: #F0F1EC;
    }

    .redBox {
      background-color: #E72F24;
    }

    .WhiteBox1 {
      grid-column: span 3;
    }

    .WhiteBox2 {
      grid-row: span 2;
    }

    .WhiteBox3 {
      grid-area: 2 / 2 / 4 / 4
    }

    .blueBox {
      background-color: #004592;
      border-bottom: 10px solid #000;
    }

    .WhiteBox4 {
      grid-row: span 2;
    }

    .yellowBox {
      background-color: #F9D01E;
    }

    .blackBox {
      background-color: #232629;
    }
    
    .unaLayer2 {
      height: 748px;
      width: 748px;
      display: grid;
      background-color: #000;
      grid-template-columns: 350px 200px 150px 50px;
      grid-template-rows: 500px 130px 155px 22px;
      gap: 9px;
    }
    .item2 {
      background-color: #F0F1EC;
    }

    .redBox2 {
      background-color: green;
    }

    .WhiteBox12 {
      grid-column: span 3;
    }

    .WhiteBox22 {
      grid-row: span 3;
    }

    .WhiteBox32 {
      grid-area: 2 / 2 / 4 / 4
    }

    .blueBox2 {
      background-color: red;
      border-bottom: 10px solid #000;
    }

    .WhiteBox42 {
      grid-row: span 2;
    }

    .yellowBox2 {
      background-color: #F9D01E;
    }

    .blackBox2 {
      background-color: #232629;
    }
    .PietMondrian {
      display: flex;
      justify-content: center;
      align-items: center;
      color: green;
      font-size: xx-large;
      font-weight: bold;
    }
    .body2 {
      display: grid;
      height: 980px;
      margin: 0;
      padding: 0;
    }
    .Tableau-No2 {

      height: 980px;
      width: 1080px;
      display: grid;
      grid-template-columns: repeat(10 100px);
      grid-template-rows: repeat(9 100px);
      background-color: #000;
      gap: 10px;
    }
    .box1 {
        display: flex;
        background-color: blue;
        grid-area: 1 / 1 / 1 / 3;
    }
    .box2 {
        display: flex;
        background-color: beige;
        grid-area: 1 / 3 / 1 / 7;
    }
    .box3 {
        display: flex;
        background-color: orange;
        grid-area: 1 / 7 / 1 / 10;
        
    }
    .box4 {display: flex;
        background-color: blue;
        grid-area: 1 / 10 / 7 / 10;
    }
    .box5 {
        background-color: beige;
        grid-area: 2 / 1 / 4 / 1;
    }
    .box6 {
        background-color: red;
        grid-area: 2 / 2 / 6 / 7;
    }
    .box7 {
        background-color: orange;
        grid-area: 2 / 7 / 4 / 10;
    }
    .box8 {
        background-color: blue;
        grid-area: 4 / 1 / 7 / 1;
    }
    .box9 {
        background-color: #000;
        grid-area: 6 / 2 / 8 / 4;
    }
    .box10 {
        background-color: blue;
        grid-area: 6 / 4 / 6 / 7;
    }
    .box11 {
        background-color: beige;
        grid-area: 4 / 7 / 6 / 7;
    }
    .box12 {
        background-color: beige;
        grid-area: 4 / 8 / 6 / 10;
    }
    .box13 {
        background-color: beige;
        grid-area: 6 / 7 / 6 / 10;
    }
    .box14 {
        background-color: orange;
        grid-area: 7 / 1 / 9 / 1;
    }
    .box15 {
        background-color: beige;
        grid-area: 8 / 2 / 8 / 4;
    }
    .box16 {
        background-color: blue;
        grid-area: 7 / 4 / 7 / 7;
    }
    .box17 {
        background-color: beige;
        grid-area: 8 / 4 / 8 / 10;
        margin-top: 80px;
    }
    .box18 {
        background-color: #000;
        grid-area: 7 / 7 / 7 / 10;
    }
    .box19 {
        background-color: red;
        grid-area: 7 / 10 / 9 / 10;
    }
  </style>
</head>

<body class="body1">
  <div class="unaLayer">
    <div class="item redBox"></div> 
    <div class="item WhiteBox1"></div>
    <div class="item WhiteBox2"></div>
    <div class="item WhiteBox3"></div>
    <div class="item blueBox"></div>
    <div class="item WhiteBox4"></div>
    <div class="item"></div>
    <div class="item yellowBox"></div>
    <div class="item blackBox"></div>
  </div>
  <hr />
<div><span class="PietMondrian">Piet Mondrian</span>   Challenge 2  </div>
  <hr />
  <div class="unaLayer2">
    <div class="item2 redBox2"></div> 
    <div class="item2 WhiteBox12"></div>
    <div class="item2 WhiteBox22"></div>
    <div class="item2 WhiteBox32"></div>
    <div class="item2 blueBox2"></div>
    <div class="item2 WhiteBox42"></div>
    <div class="item2"></div>
    <div class="item2 yellowBox2"></div>
    <div class="item2 blackBox2"></div>
  </div>
<hr />  
</body>

    <div class="item3 box14"></div>
    <div class="item3 box15"></div>
    <div class="item3 box16"></div>

  </div> 
</body>
</html>
